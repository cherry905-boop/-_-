<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>만족도 조사 · 일학습병행 앱</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1f4e8c" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
  <style>
    .rate{display:flex;gap:6px;margin-top:6px}
    .rate label{flex:1;text-align:center;padding:10px 0;margin:0;border:1px solid var(--line);border-radius:10px;font-weight:600;cursor:pointer;font-size:15px}
    .rate input{display:none}
    .rate input:checked + span{color:#fff}
    .rate label:has(input:checked){background:var(--brand);border-color:var(--brand);color:#fff}
    .q{margin-top:18px}
    .q>label{font-weight:700;font-size:15px}
    .scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
  </style>
</head>
<body>
  <div class="topbar"><h1>📊 만족도 조사</h1><p id="who"></p></div>
  <div class="wrap">
    <div class="card" id="form">
      <p class="note">센터 운영 개선을 위한 <b>자체 설문</b>입니다(공단 공식 만족도와 별개). 익명으로 집계됩니다.</p>
      <label>학기</label>
      <select id="semester"><option>2026 1학기</option><option>2026 2학기</option></select>
      <div id="questions"></div>
      <div class="q">
        <label>개선 의견 (선택)</label>
        <textarea id="comment" rows="3" style="width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;margin-top:6px" placeholder="바라는 점·불편한 점을 자유롭게"></textarea>
      </div>
      <button class="btn" id="submit">제출하기</button>
      <div class="status" id="status"></div>
    </div>
    <div class="card" id="done" style="display:none;text-align:center">
      <h2>제출 완료</h2>
      <p class="note">소중한 의견 감사합니다.</p>
      <a href="./index.html" class="btn" style="text-decoration:none">홈으로</a>
    </div>
    <a href="./index.html" class="btn ghost" id="homeBtn" style="text-decoration:none;text-align:center;margin-top:20px">홈으로</a>
  </div>

  <script type="module">
    import { supabase, configReady, setStatus } from './app.js';
    const $ = id => document.getElementById(id);
    let profile = {}; try { profile = JSON.parse(localStorage.getItem('ilhak_profile') || '{}'); } catch (_) {}
    $('who').textContent = profile.name ? `${profile.name}님` : '';

    // 만족도는 학습근로자(재학생) 대상 — 그 외 대상은 안내만
    if (profile.target_type && profile.target_type !== 'student') {
      $('form').style.display = 'none'; $('homeBtn').style.display = 'none';
      $('done').style.display = 'block';
      $('done').innerHTML = '<h2>안내</h2><p class="note">이 만족도 설문은 학습근로자(재학생) 대상입니다.</p><a href="./index.html" class="btn" style="text-decoration:none">홈으로</a>';
    }

    const QS = [
      { key: 'r_train', label: '훈련 내용 만족도' },
      { key: 'r_facility', label: '시설·환경 만족도' },
      { key: 'r_teacher', label: '교·강사 만족도' },
      { key: 'r_ops', label: '운영·소통 만족도' },
      { key: 'r_overall', label: '전반 만족도' },
    ];
    QS.forEach(q => {
      const div = document.createElement('div'); div.className = 'q';
      let radios = '';
      for (let i = 1; i <= 5; i++) radios += `<label><input type="radio" name="${q.key}" value="${i}"><span>${i}</span></label>`;
      div.innerHTML = `<label>${q.label} <span class="req">*</span></label><div class="rate">${radios}</div><div class="scale"><span>매우 불만족</span><span>매우 만족</span></div>`;
      $('questions').appendChild(div);
    });

    $('submit').addEventListener('click', async () => {
      const row = { semester: $('semester').value, job_key: profile.job_key || null, comment: $('comment').value.trim() || null };
      for (const q of QS) {
        const sel = document.querySelector(`input[name=${q.key}]:checked`);
        if (!sel) { setStatus($('status'), '모든 항목을 평가해주세요.', 'error'); return; }
        row[q.key] = parseInt(sel.value, 10);
      }
      if (!configReady()) { setStatus($('status'), 'Supabase 연결이 필요합니다.', 'error'); return; }
      $('submit').disabled = true; setStatus($('status'), '제출 중...', 'info');
      const { error } = await supabase.from('survey_responses').insert(row);
      $('submit').disabled = false;
      if (error) { setStatus($('status'), '오류: ' + error.message, 'error'); return; }
      $('form').style.display = 'none'; $('homeBtn').style.display = 'none'; $('done').style.display = 'block';
    });
  </script>
</body>
</html>
