<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>만족도 조사 · 일학습병행 앱</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#002968" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
  <style>
    /* 만족도 척도: 라디오를 scale-btn 룩으로 표현(쿼리 보존을 위해 radio 유지) */
    .scale-row label{flex:1;margin:0;position:relative;cursor:pointer}
    .scale-row label input{position:absolute;opacity:0;width:0;height:0}
    .scale-row label span{display:flex;align-items:center;justify-content:center;height:46px;
      border-radius:11px;border:1.5px solid var(--border-default);background:var(--surface-card);
      font-weight:700;font-size:15px;color:var(--text-secondary);transition:.12s}
    .scale-row label:has(input:checked) span{background:var(--accent);border-color:var(--accent);color:#fff}
  </style>
</head>
<body>
  <div class="app">
    <header class="ph-header">
      <img class="wm" src="./assets/logo-mono-white.png" alt="" />
      <div class="ph-lockup"><img src="./assets/logo-mono-white.png" alt="" /><span>일학습병행 공동훈련센터</span></div>
      <div class="ph-title-row"><a class="ph-back" href="./index.html" aria-label="뒤로"><i data-lucide="chevron-left"></i></a><h1 class="ph-title">만족도 조사</h1></div>
      <p class="ph-sub"><span id="who"></span> 센터 운영 개선을 위한 자체 설문입니다</p>
    </header>
    <main class="ph-body">
      <div class="card" id="form">
        <div class="mju-alert mju-alert--info">
          <span class="mju-alert__icon">i</span>
          <div class="mju-alert__body">
            <div class="mju-alert__title">센터 자체 설문</div>
            <div class="mju-alert__text">공단 공식 만족도와 별개이며, 익명으로 집계됩니다.</div>
          </div>
        </div>
        <p class="ph-card-title" style="margin-top:14px">학기</p>
        <select id="semester" class="ph-select"><option>2026 1학기</option><option>2026 2학기</option></select>
        <div id="questions"></div>
        <div style="margin-top:18px">
          <span class="field-label">개선 의견 (선택)</span>
          <textarea id="comment" class="ph-ta" rows="3" placeholder="바라는 점·불편한 점을 자유롭게"></textarea>
        </div>
        <button class="mju-btn mju-btn--full" id="submit" style="margin-top:16px">제출하기</button>
        <div class="status" id="status"></div>
      </div>
      <div class="card accent" id="done" style="display:none;text-align:center">
        <span class="ei" style="margin:0 auto 10px"><i data-lucide="check"></i></span>
        <p class="ph-card-title">제출 완료</p>
        <p class="ph-note">소중한 의견 감사합니다.</p>
      </div>
      <a href="./index.html" class="mju-btn mju-btn--secondary mju-btn--full" id="homeBtn" style="margin-top:auto">홈으로</a>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module">
    import { supabase, configReady, setStatus, friendlyError } from './app.js';
    if (window.lucide) window.lucide.createIcons();
    const $ = id => document.getElementById(id);
    let profile = {}; try { profile = JSON.parse(localStorage.getItem('ilhak_profile') || '{}'); } catch (_) {}
    $('who').textContent = profile.name ? `${profile.name}님 ·` : '';

    // 만족도는 학습근로자(재학생) 대상 — 그 외 대상은 안내만
    if (profile.target_type && profile.target_type !== 'student') {
      $('form').style.display = 'none'; $('homeBtn').style.display = 'none';
      $('done').style.display = 'block';
      $('done').innerHTML = '<span class="ei" style="margin:0 auto 10px"><i data-lucide="shield"></i></span><p class="ph-card-title">안내</p><p class="ph-note">이 만족도 설문은 학습근로자(재학생) 대상입니다.</p><a href="./index.html" class="mju-btn mju-btn--secondary mju-btn--full" style="margin-top:14px">홈으로</a>';
      window.lucide?.createIcons();
    }

    const QS = [
      { key: 'r_train', label: '훈련 내용 만족도' },
      { key: 'r_facility', label: '시설·환경 만족도' },
      { key: 'r_teacher', label: '교·강사 만족도' },
      { key: 'r_ops', label: '운영·소통 만족도' },
      { key: 'r_overall', label: '전반 만족도' },
    ];
    QS.forEach(q => {
      const div = document.createElement('div'); div.style.marginTop = '18px';
      let radios = '';
      for (let i = 1; i <= 5; i++) radios += `<label><input type="radio" name="${q.key}" value="${i}"><span>${i}</span></label>`;
      div.innerHTML = `<span class="field-label">${q.label} <span class="req">*</span></span><div class="scale-row">${radios}</div><div class="scale-ends"><span>매우 불만족</span><span>매우 만족</span></div>`;
      $('questions').appendChild(div);
    });

    // 기기 식별값(랜덤, PII 아님) — 서버측 1인1표(device_id+semester 유일)용
    const deviceId = (() => {
      try { let d = localStorage.getItem('ilhak_device_id'); if (!d) { d = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('ilhak_device_id', d); } return d; }
      catch (_) { return null; }
    })();
    $('submit').addEventListener('click', async () => {
      const row = { semester: $('semester').value, job_key: profile.job_key || null, comment: $('comment').value.trim() || null, device_id: deviceId };
      const dupKey = 'ilhak_survey_' + row.semester;
      if (localStorage.getItem(dupKey)) { setStatus($('status'), '이미 이 학기 만족도를 제출하셨어요. 감사합니다.', 'ok'); return; }
      for (const q of QS) {
        const sel = document.querySelector(`input[name=${q.key}]:checked`);
        if (!sel) { setStatus($('status'), '모든 항목을 평가해주세요.', 'error'); return; }
        row[q.key] = parseInt(sel.value, 10);
      }
      if (!configReady()) { setStatus($('status'), 'Supabase 연결이 필요합니다.', 'error'); return; }
      $('submit').disabled = true; setStatus($('status'), '제출 중...', 'info');
      let { error } = await supabase.from('survey_responses').insert(row);
      // device_id 컬럼이 아직 없으면(마이그레이션 실행 전) device_id 빼고 재시도 → 배포 순서 무관
      if (error && /device_id/i.test(error.message || '')) { const r2 = { ...row }; delete r2.device_id; ({ error } = await supabase.from('survey_responses').insert(r2)); }
      $('submit').disabled = false;
      // 23505 = 이 기기가 이 학기에 이미 제출(서버측 유일 제약) → 정상 처리
      if (error && error.code !== '23505') { setStatus($('status'), friendlyError(error), 'error'); return; }
      try { localStorage.setItem(dupKey, '1'); } catch (_) {}
      $('form').style.display = 'none'; $('homeBtn').style.display = 'none'; $('done').style.display = 'block';
      window.lucide?.createIcons();
    });
  </script>
</body>
</html>
