<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>공지 · 일학습병행 앱</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#002968" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
</head>
<body>
  <div class="app">
    <header class="ph-header">
      <img class="wm" src="./assets/logo-mono-white.png" alt="" />
      <div class="ph-lockup"><img src="./assets/logo-mono-white.png" alt="" /><span>일학습병행 공동훈련센터</span></div>
      <div class="ph-title-row"><a class="ph-back" href="./index.html" aria-label="뒤로"><i data-lucide="chevron-left"></i></a><h1 class="ph-title">공지사항</h1></div>
      <p class="ph-sub" id="who"></p>
    </header>
    <main class="ph-body">
      <div class="searchbar" id="sb" style="display:none">
        <i data-lucide="search"></i>
        <input type="search" id="q" placeholder="공지 검색 (제목·내용)" aria-label="공지 검색" autocomplete="off" />
        <button type="button" class="sb-clear" id="qClear" aria-label="검색어 지우기" style="display:none">✕</button>
      </div>
      <p class="result-count" id="rcount" style="display:none" aria-live="polite"></p>
      <div id="list"></div>
      <button class="mju-btn mju-btn--secondary mju-btn--full loadmore" id="more" style="display:none">더 보기</button>
      <p class="note" id="empty" style="display:none;text-align:center;margin-top:30px">표시할 공지가 없습니다.</p>
      <a href="./index.html" class="mju-btn mju-btn--secondary mju-btn--full" style="margin-top:auto;text-decoration:none">홈으로</a>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module">
    import { supabase, configReady, esc, getProfile, noticeMatches, skeletonList, clearSkeleton,
             getReadSet, markNoticesRead, updateUnreadBadges, getCenterId } from './app.js';
    if (window.lucide) window.lucide.createIcons();

    // 이 기기의 프로필(가입 때 저장) — 공지 필터링용
    const profile = getProfile();
    document.getElementById('who').textContent = profile.name ? `${profile.name}님 맞춤 공지` : '전체 공지';

    function fmt(d) { try { return new Date(d).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }); } catch (_) { return d; } }
    // 새 공지(NEW) 판단 — 최근 3일 이내 작성
    function isNew(d) { try { return (Date.now() - new Date(d).getTime()) < 3 * 24 * 60 * 60 * 1000; } catch (_) { return false; } }

    const $ = id => document.getElementById(id);
    const listEl = $('list'), emptyEl = $('empty'), moreBtn = $('more');
    const qEl = $('q'), qClear = $('qClear'), rcount = $('rcount');
    const PAGE = 8;
    let all = [];        // 매칭된 전체 공지(개인 안내 병합·정렬 완료)
    let filtered = [];   // 검색 적용분
    let shownCount = 0;
    const readBefore = getReadSet();   // 이번 방문 '이전'의 읽음 — unread 표시 기준

    function cardFor(n) {
      const card = document.createElement('div');
      card.className = 'card';
      const unread = !readBefore.has(n.id) ? `<span class="unread-dot" aria-hidden="true"></span><span class="sr-only">안 읽음</span> ` : '';
      card.innerHTML = `<p class="ph-card-title">${unread}${esc(n.title)}` +
        (n._personal ? ` <span class="mju-badge mju-badge--coral">개인 안내</span>` : (isNew(n.created_at) ? ` <span class="mju-badge mju-badge--coral">NEW</span>` : ``)) + `</p>` +
        `<p class="notice-card-time">${fmt(n.created_at)}</p>` +
        `<p class="notice-body">${esc(n.body)}</p>`;
      return card;
    }
    function renderMore() {
      const slice = filtered.slice(shownCount, shownCount + PAGE);
      slice.forEach(n => listEl.appendChild(cardFor(n)));
      shownCount += slice.length;
      moreBtn.style.display = shownCount < filtered.length ? 'block' : 'none';
      moreBtn.textContent = `더 보기 (${filtered.length - shownCount}건 남음)`;
    }
    function applyFilter() {
      const q = (qEl.value || '').trim().toLowerCase();
      qClear.style.display = q ? 'block' : 'none';
      filtered = !q ? all
        : all.filter(n => (n.title || '').toLowerCase().includes(q) || (n.body || '').toLowerCase().includes(q));
      listEl.innerHTML = ''; shownCount = 0;
      if (!filtered.length) {
        emptyEl.style.display = 'block';
        emptyEl.textContent = q ? `'${qEl.value.trim()}' 검색 결과가 없습니다.` : '표시할 공지가 없습니다.';
        moreBtn.style.display = 'none'; rcount.style.display = 'none';
        return;
      }
      emptyEl.style.display = 'none';
      rcount.style.display = q ? 'block' : 'none';
      rcount.textContent = `검색 결과 ${filtered.length}건`;
      renderMore();
    }
    qEl.addEventListener('input', applyFilter);
    qClear.addEventListener('click', () => { qEl.value = ''; applyFilter(); qEl.focus(); });
    moreBtn.addEventListener('click', renderMore);

    (async () => {
      if (!configReady()) { emptyEl.style.display = 'block'; emptyEl.textContent = 'Supabase 연결이 필요합니다(config.js).'; return; }
      skeletonList(listEl, 3);
      const cid = await getCenterId();                          // [P3] 센터 스코프(가능할 때만)
      let nq = supabase.from('notices').select('id,title,body,target_scope,target_value,created_at').eq('published', true);
      if (cid) nq = nq.eq('center_id', cid);
      const { data, error } = await nq.order('created_at', { ascending: false });
      clearSkeleton(listEl);
      if (error) { emptyEl.style.display = 'block'; emptyEl.textContent = '일시적 오류로 불러오지 못했어요. 잠시 후 새로고침해주세요.'; console.error(error); return; }

      const shown = (data || []).filter(n => noticeMatches(n, profile));
      // 개인 지정 공지(비공개) — 서명토큰으로 '내 것'만 서버에서 받아 병합(본문은 anon 공개목록엔 없음)
      if (profile.token) {
        try {
          const { data: pers } = await supabase.rpc('my_personal_notices', { p_token: profile.token });
          if (Array.isArray(pers) && pers.length) {
            const seen = new Set(shown.map(r => r.id));
            pers.forEach(p => { if (!seen.has(p.id)) shown.push({ ...p, _personal: true }); });
            shown.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          }
        } catch (_) {}
      }
      all = shown;
      if (!all.length) {
        emptyEl.style.display = 'block';
        if (!profile.name) emptyEl.innerHTML = '내 정보가 이 기기에 없어 맞춤 공지가 안 보일 수 있어요.<br/><a href="./index.html">홈에서 정보 입력하기</a>';
        return;
      }
      if (all.length > 3) $('sb').style.display = 'block';
      applyFilter();
      // 이 페이지를 본 것 = 읽음 처리 → 탭바·홈 배지 갱신
      // (오래된 것부터 저장해, 저장 한도 초과 시 최신 공지가 먼저 밀려나지 않게)
      markNoticesRead(all.map(n => n.id).reverse());
      updateUnreadBadges();
      window.lucide?.createIcons();
    })();
  </script>
</body>
</html>
