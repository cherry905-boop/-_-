<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>모집 기업 · 명지대 일학습병행</title>
  <meta name="description" content="지금 학습근로자를 모집 중인 명지대 일학습병행 참여기업과 채용공고" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#002968" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
</head>
<body>
  <div class="app">
    <header class="ph-header">
      <img class="wm" src="./assets/logo-mono-white.png" alt="" />
      <div class="ph-lockup"><img src="./assets/logo-mono-white.png" alt="" /><span>일학습병행 공동훈련센터</span></div>
      <div class="ph-title-row"><a class="ph-back" href="./intro.html" aria-label="뒤로"><i data-lucide="chevron-left"></i></a><h1 class="ph-title">모집 기업</h1></div>
      <p class="ph-sub">지금 학습근로자를 찾고 있는 기업들이에요</p>
    </header>

    <main class="ph-body">
      <div class="searchbar" id="sb" style="display:none">
        <i data-lucide="search"></i>
        <input type="search" id="q" placeholder="기업·직무 검색" aria-label="기업·직무 검색" autocomplete="off" />
        <button type="button" class="sb-clear" id="qClear" aria-label="검색어 지우기" style="display:none">✕</button>
      </div>
      <div class="filter-chips" id="chips" style="display:none" role="group" aria-label="직무 필터"></div>
      <div id="list"></div>
      <div class="empty-state" id="empty" style="display:none">
        <span class="ei"><i data-lucide="building"></i></span>
        <div class="et">지금은 공개된 모집 공고가 없어요</div>
        <p class="es">채용 알림을 등록해두면 새 공고가 뜰 때 바로 알려드려요.</p>
      </div>
      <div class="card accent" style="margin-top:6px">
        <p class="ph-card-title"><i data-lucide="bell-plus"></i> 새 공고를 놓치지 마세요</p>
        <p class="ph-note" style="margin-bottom:12px">이름·휴대폰·관심직무만 등록하면 새 모집공고를 알림으로 받아요.</p>
        <a href="./index.html?as=applicant" class="mju-btn mju-btn--gold mju-btn--full" style="text-decoration:none">채용 알림 받기</a>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module">
    import { supabase, configReady, esc, skeletonList, clearSkeleton } from './app.js';
    if (window.lucide) window.lucide.createIcons();

    const $ = id => document.getElementById(id);
    const listEl = $('list'), emptyEl = $('empty'), chipsEl = $('chips');
    const qEl = $('q'), qClear = $('qClear');
    let all = [], jobSel = '';

    function dday(dateStr) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const d = new Date(dateStr + 'T00:00:00');
      const diff = Math.round((d - today) / 86400000);
      if (diff === 0) return { label: '오늘 마감', cls: 'urgent' };
      if (diff > 0) return { label: 'D-' + diff, cls: diff <= 7 ? 'urgent' : '' };
      return null; // 마감 지난 공고는 표시 안 함
    }

    function render() {
      const q = (qEl.value || '').trim().toLowerCase();
      qClear.style.display = q ? 'block' : 'none';
      const shown = all.filter(p =>
        (!jobSel || p.job_key === jobSel) &&
        (!q || [p.company, p.job_key, p.title, p.region].some(x => (x || '').toLowerCase().includes(q))));
      listEl.innerHTML = '';
      if (!shown.length) {
        emptyEl.style.display = 'block';
        if (all.length) {
          emptyEl.innerHTML = '<span class="ei"><i data-lucide="search"></i></span><div class="et">조건에 맞는 공고가 없어요</div><p class="es">검색어나 직무 필터를 바꿔보세요.</p>';
        }
        window.lucide?.createIcons();
        return;
      }
      emptyEl.style.display = 'none';
      shown.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        const dd = p.deadline ? dday(p.deadline) : null;
        const ddHtml = p.deadline
          ? (dd ? `<span class="dday ${dd.cls}">${dd.label}</span>` : '')
          : '<span class="dday">상시</span>';
        card.innerHTML =
          `<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">` +
          `<div style="min-width:0"><p class="ph-card-title" style="margin:0">${esc(p.company)}</p>` +
          `<p class="notice-card-time" style="margin:3px 0 0">${esc(p.job_key || '')}${p.region ? ' · ' + esc(p.region) : ''}</p></div>${ddHtml}</div>` +
          `<p class="notice-body" style="margin-top:8px"><b>${esc(p.title)}</b>${p.intro ? '<br/>' + esc(p.intro) : ''}</p>` +
          (p.perks ? `<p class="ph-note" style="margin-top:6px"><i data-lucide="gift" style="width:14px;height:14px;vertical-align:-2px"></i> ${esc(p.perks)}</p>` : '');
        listEl.appendChild(card);
      });
      window.lucide?.createIcons();
    }
    function syncChips() {
      [...chipsEl.children].forEach(b => {
        const on = b.dataset.val === jobSel;
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }
    function buildChips() {
      const jobs = [...new Set(all.map(p => p.job_key).filter(Boolean))];
      if (jobs.length < 2) return;
      chipsEl.innerHTML = '';
      const mk = (label, val) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chip'; b.textContent = label; b.dataset.val = val;
        b.addEventListener('click', () => { jobSel = val; syncChips(); render(); });
        chipsEl.appendChild(b);
      };
      mk('전체', '');
      jobs.forEach(j => mk(j, j));
      syncChips();
      chipsEl.style.display = 'flex';
    }
    qEl.addEventListener('input', render);
    qClear.addEventListener('click', () => { qEl.value = ''; render(); qEl.focus(); });

    (async () => {
      if (!configReady()) { emptyEl.style.display = 'block'; return; }
      skeletonList(listEl, 3);
      const todayStr = new Date().toISOString().slice(0, 10);
      let data = null;
      try {
        const res = await supabase.from('job_postings')
          .select('company,job_key,title,region,intro,perks,deadline,created_at')
          .eq('published', true)
          .or(`deadline.is.null,deadline.gte.${todayStr}`)
          .order('created_at', { ascending: false });
        if (!res.error) data = res.data;
      } catch (_) {}
      clearSkeleton(listEl);
      all = data || [];   // 테이블 미생성(마이그레이션 전)이어도 빈 상태로 동작
      if (!all.length) { emptyEl.style.display = 'block'; window.lucide?.createIcons(); return; }
      if (all.length > 4) $('sb').style.display = 'block';
      buildChips();
      render();
    })();
  </script>
</body>
</html>
