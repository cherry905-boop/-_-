<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>일정 · 일학습병행 앱</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#002968" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
</head>
<body>
  <div class="app">
    <header class="ph-header">
      <img class="wm" src="./assets/logo-mono-white.png" alt="" />
      <div class="ph-lockup"><img src="./assets/logo-mono-white.png" alt="" /><span>일학습병행 공동훈련센터</span></div>
      <div class="ph-title-row"><a class="ph-back" href="./index.html" aria-label="뒤로"><i data-lucide="chevron-left"></i></a><h1 class="ph-title">일정</h1></div>
      <p class="ph-sub" id="who"></p>
    </header>
    <main class="ph-body">
      <div id="list"></div>
      <div id="empty" class="empty-state" style="display:none">
        <span class="ei"><i data-lucide="calendar-days"></i></span>
        <div class="et">예정된 일정이 없습니다</div>
        <p class="es" id="emptyMsg">새로운 일정이 등록되면 여기에 표시됩니다.</p>
      </div>
      <a href="./index.html" class="mju-btn mju-btn--secondary mju-btn--full" style="margin-top:auto;text-decoration:none">홈으로</a>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module">
    import { supabase, configReady } from './app.js';
    if (window.lucide) window.lucide.createIcons();

    let profile = {};
    try { profile = JSON.parse(localStorage.getItem('ilhak_profile') || '{}'); } catch (_) {}
    document.getElementById('who').textContent = profile.name ? `${profile.name}님 일정` : '';

    const normCo = (s) => (s || '').replace(/㈜|\(주\)|주식회사|\s/g, '');
    function matchSel(sel) {
      if (!sel) return false;
      if (sel.targets && sel.targets.includes(profile.target_type)) return true;
      if (sel.jobs && profile.job_key && sel.jobs.includes(profile.job_key)) return true;
      if (sel.companies && profile.company && sel.companies.map(normCo).includes(normCo(profile.company))) return true;
      if (sel.types && profile.type1 && sel.types.includes(profile.type1)) return true;
      return false;
    }
    const visible = (r) => {
      if (!r.job_key) return true;                                   // 전체
      if (r.job_key.indexOf('custom:') === 0) { try { return matchSel(JSON.parse(r.job_key.slice(7))); } catch (_) { return false; } }
      return r.job_key === profile.job_key;                          // 단일 직무(기존)
    };
    const esc = (s) => { const e = document.createElement('div'); e.textContent = s || ''; return e.innerHTML; };
    const KIND_BADGE = { '외부평가': 'mju-badge--coral', '마감': 'mju-badge--gold', 'OT': 'mju-badge--navy', '특강': 'mju-badge--sky', '행사': 'mju-badge--navy', '기타': 'mju-badge--neutral' };

    // D-day 계산 (로컬 자정 기준)
    function dday(dateStr) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const d = new Date(dateStr + 'T00:00:00');
      const diff = Math.round((d - today) / 86400000);
      if (diff === 0) return { label: 'D-DAY', color: '#c1121f' };
      if (diff > 0) return { label: 'D-' + diff, color: diff <= 7 ? '#c1121f' : '#1f4e8c' };
      return { label: '종료', color: '#94a3b8' };
    }
    const fmtDate = (s) => { try { return new Date(s + 'T00:00:00').toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }); } catch (_) { return s; } };

    const listEl = document.getElementById('list');
    (async () => {
      if (!configReady()) { document.getElementById('empty').style.display = 'block'; return; }
      const todayStr = new Date().toISOString().slice(0, 10);
      const { data, error } = await supabase.from('calendar_events')
        .select('title,event_date,kind,job_key,memo').gte('event_date', todayStr).order('event_date', { ascending: true });
      if (error) { const e = document.getElementById('empty'); e.style.display = 'block'; document.getElementById('emptyMsg').textContent = '일시적 오류로 불러오지 못했습니다. 잠시 후 새로고침해주세요.'; console.error(error); return; }
      const shown = (data || []).filter(visible);
      if (!shown.length) {
        const em = document.getElementById('empty'); em.style.display = 'block';
        if (!profile.name) document.getElementById('emptyMsg').innerHTML = '내 정보가 이 기기에 없어 맞춤 일정이 안 보일 수 있어요.<br/><a href="./index.html">홈에서 정보 입력하기</a>';
        return;
      }
      shown.forEach(r => {
        const dd = dday(r.event_date);
        const badgeCls = KIND_BADGE[r.kind] || 'mju-badge--neutral';
        const ddClass = dd.label === '종료' ? 'dday muted' : (dd.color === '#c1121f' ? 'dday urgent' : 'dday');
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">` +
          `<span class="mju-badge ${badgeCls}">${esc(r.kind)}</span>` +
          `<span class="${ddClass}">${dd.label}</span></div>` +
          `<p class="ph-card-title" style="margin:0 0 2px">${esc(r.title)}</p>` +
          `<p class="notice-card-time" style="margin:2px 0 0">${fmtDate(r.event_date)}${r.memo ? ' · ' + esc(r.memo) : ''}</p>`;
        listEl.appendChild(card);
      });
      window.lucide?.createIcons();
    })();
  </script>
</body>
</html>
