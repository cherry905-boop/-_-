<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>투표 · 일학습병행 앱</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#002968" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
  <style>
    .opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;margin-top:7px;
      border:1.5px solid var(--border-default);border-radius:11px;background:var(--surface-card);
      cursor:pointer;font-weight:600;font-size:14px;color:var(--text-secondary);line-height:1.5;transition:.12s}
    .opt input{width:18px;height:18px;margin:1px 0 0;flex-shrink:0;accent-color:var(--accent)}
    .opt:has(input:checked){border-color:var(--accent);background:var(--tint-bg);color:var(--tint-fg)}
    .res-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13.5px}
    .res-row .lbl{flex:1;min-width:0;font-weight:600;color:var(--text-secondary)}
    .res-row .n{width:34px;text-align:right;font-weight:700}
    .res-row .agg-bar{width:38%}
  </style>
</head>
<body>
  <div class="app">
    <header class="ph-header">
      <img class="wm" src="./assets/logo-mono-white.png" alt="" />
      <div class="ph-lockup"><img src="./assets/logo-mono-white.png" alt="" /><span>일학습병행 공동훈련센터</span></div>
      <div class="ph-title-row"><a class="ph-back" href="./index.html" aria-label="뒤로"><i data-lucide="chevron-left"></i></a><h1 class="ph-title">투표</h1></div>
      <p class="ph-sub">여러분의 의견이 운영에 반영돼요</p>
    </header>
    <main class="ph-body">
      <div id="po-list"><div class="card"><p class="note">투표를 불러오는 중...</p></div></div>
      <a href="./index.html" class="mju-btn mju-btn--secondary mju-btn--full" style="margin-top:auto">홈으로</a>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module">
    import { supabase, configReady, setStatus, friendlyError, esc, matchSel } from './app.js';
    if (window.lucide) window.lucide.createIcons();
    const $ = id => document.getElementById(id);
    let profile = {}; try { profile = JSON.parse(localStorage.getItem('ilhak_profile') || '{}'); } catch (_) {}

    const deviceId = (() => {
      try { let d = localStorage.getItem('ilhak_device_id'); if (!d) { d = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('ilhak_device_id', d); } return d; }
      catch (_) { return null; }
    })();
    const votedKey = id => 'ilhak_poll_' + id;
    const hasVoted = id => { try { return !!localStorage.getItem(votedKey(id)); } catch (_) { return false; } };
    const visible = p => p.target_scope === 'all' || (() => { try { return matchSel(JSON.parse(p.target_value || '{}'), profile, true); } catch (_) { return false; } })();

    const listEl = $('po-list');

    async function load() {
      if (!profile.name) {
        listEl.innerHTML = '<div class="card" style="text-align:center"><span class="ei" style="margin:0 auto 10px"><i data-lucide="user"></i></span><p class="ph-card-title">내 정보가 필요해요</p><p class="ph-note">가입(또는 내 정보 불러오기) 후 참여할 수 있어요.</p><a href="./index.html" class="mju-btn mju-btn--secondary mju-btn--full" style="margin-top:14px">홈에서 정보 입력하기</a></div>';
        window.lucide?.createIcons(); return;
      }
      if (!configReady()) { listEl.innerHTML = '<div class="card"><p class="note">Supabase 연결이 필요합니다.</p></div>'; return; }
      const { data, error } = await supabase.from('polls')
        .select('id,question,description,options,target_scope,target_value,multi,results_public,open,close_at,created_at')
        .order('created_at', { ascending: false }).limit(50);
      if (error) {
        listEl.innerHTML = '<div class="card"><p class="note">' + (/relation|does not exist|schema cache/i.test(error.message || '') ? '투표 기능이 아직 준비 중이에요. (관리자: sql/17 실행 필요)' : '투표를 불러오지 못했어요 — ' + esc(error.message)) + '</p></div>';
        return;
      }
      const rows = (data || []).filter(visible);
      if (!rows.length) {
        listEl.innerHTML = '<div class="card" style="text-align:center"><span class="ei" style="margin:0 auto 10px"><i data-lucide="vote"></i></span><p class="ph-card-title">진행 중인 투표가 없어요</p><p class="ph-note">새 투표가 열리면 알림으로 알려드릴게요.</p></div>';
        window.lucide?.createIcons(); return;
      }
      listEl.innerHTML = '';
      rows.forEach(renderPoll);
      window.lucide?.createIcons();
    }

    function renderPoll(p) {
      const closed = !p.open || (p.close_at && new Date(p.close_at) < new Date());
      const voted = hasVoted(p.id);
      const card = document.createElement('div'); card.className = 'card'; card.style.marginTop = '12px';
      let head = `<p class="ph-card-title" style="margin-bottom:2px">${esc(p.question)} ${closed ? '<span class="mju-badge mju-badge--neutral">마감</span>' : voted ? '<span class="mju-badge mju-badge--success">참여 완료</span>' : ''}</p>` +
        (p.description ? `<p class="note">${esc(p.description)}</p>` : '') +
        (p.close_at && !closed ? `<p class="note">마감 ${new Date(p.close_at).toLocaleString('ko-KR')}</p>` : '');
      card.innerHTML = head;
      if (closed || voted) { showResults(p, card); }
      else {
        const type = p.multi ? 'checkbox' : 'radio';
        const box = document.createElement('div');
        box.innerHTML = (p.options || []).map((opt, i) =>
          `<label class="opt"><input type="${type}" name="po-${p.id}" value="${i}"><span>${esc(opt)}</span></label>`).join('') +
          (p.multi ? '<p class="note" style="margin-top:6px">여러 개를 고를 수 있어요.</p>' : '');
        card.appendChild(box);
        const btn = document.createElement('button'); btn.className = 'mju-btn mju-btn--full'; btn.style.marginTop = '12px'; btn.textContent = '투표하기';
        const st = document.createElement('div'); st.className = 'status';
        btn.addEventListener('click', async () => {
          const sel = [...card.querySelectorAll(`input[name="po-${p.id}"]:checked`)].map(i => i.value);
          if (!sel.length) { setStatus(st, '보기를 선택해주세요.', 'error'); return; }
          btn.disabled = true; setStatus(st, '제출 중...', 'info');
          const { error } = await supabase.from('poll_votes').insert({ poll_id: p.id, choices: sel, device_id: deviceId });
          btn.disabled = false;
          // 23505 = 이 기기는 이미 투표함(서버측 유일 제약) → 정상 처리
          if (error && error.code !== '23505') {
            if (error.code === '42501' || /row-level|policy/i.test(error.message || '')) { setStatus(st, '마감된 투표예요.', 'error'); return; }
            setStatus(st, friendlyError(error), 'error'); return;
          }
          try { localStorage.setItem(votedKey(p.id), '1'); } catch (_) {}
          card.querySelector('.ph-card-title').innerHTML = `${esc(p.question)} <span class="mju-badge mju-badge--success">참여 완료</span>`;
          box.remove(); btn.remove(); st.remove();
          showResults(p, card);
        });
        card.appendChild(btn); card.appendChild(st);
      }
      listEl.appendChild(card);
    }

    async function showResults(p, card) {
      const box = document.createElement('div'); box.innerHTML = '<p class="note" style="margin-top:8px">결과 불러오는 중...</p>';
      card.appendChild(box);
      let res = null;
      try { const { data } = await supabase.rpc('poll_results', { p_poll: p.id }); res = data; } catch (_) {}
      if (!res) { box.innerHTML = '<p class="note" style="margin-top:8px">결과를 불러오지 못했어요.</p>'; return; }
      if (!res.counts) { box.innerHTML = `<p class="note" style="margin-top:8px">참여 ${res.total}명 — 결과는 운영팀이 확인 중이에요.</p>`; return; }
      const maxN = Math.max(1, ...(p.options || []).map((_, i) => res.counts[String(i)] || 0));
      box.innerHTML = `<p class="note" style="margin-top:8px">참여 ${res.total}명</p>` +
        (p.options || []).map((opt, i) => {
          const n = res.counts[String(i)] || 0;
          return `<div class="res-row"><span class="lbl">${esc(opt)}</span><span class="n">${n}</span><div class="agg-bar"><i style="width:${Math.round(n / maxN * 100)}%"></i></div></div>`;
        }).join('');
    }

    load();
  </script>
</body>
</html>
