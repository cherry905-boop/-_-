<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>보안 자가점검 (RLS) · 일학습병행 앱</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#002968" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
</head>
<body>
  <div class="app">
    <header class="ph-header">
      <img class="wm" src="./assets/logo-mono-white.png" alt="" />
      <div class="ph-lockup"><img src="./assets/logo-mono-white.png" alt="" /><span>일학습병행 공동훈련센터</span></div>
      <div class="ph-title-row"><a class="ph-back" href="./index.html" aria-label="뒤로"><i data-lucide="chevron-left"></i></a><h1 class="ph-title">보안 자가점검</h1></div>
      <p class="ph-sub">익명 사용자가 개인정보를 읽을 수 없는지 기계가 대신 검사</p>
    </header>
    <main class="ph-body">
      <div class="mju-alert mju-alert--info">
        <span class="mju-alert__icon"><i data-lucide="shield"></i></span>
        <div class="mju-alert__body">
          <div class="mju-alert__title">관리자 전용 도구</div>
          <div class="mju-alert__text">이 페이지는 <b>익명(anon) 키</b>로 각 테이블을 몰래 읽어보려고 시도합니다. <b>차단됨(PASS)</b> = 안전 / <b>읽힘(FAIL)</b> = 즉시 RLS를 고쳐야 함.</div>
        </div>
      </div>

      <div class="card accent">
        <p class="ph-card-title">RLS 점검 실행</p>
        <p class="ph-note">정확한 검사를 위해, <b>students 테이블에 더미 1줄 이상</b> 넣은 뒤 실행하세요. 빈 테이블은 읽혀도 0줄이라 구분이 안 됩니다.</p>
        <button class="mju-btn mju-btn--full" id="run" style="margin-top:14px"><i data-lucide="shield-check"></i> 점검 실행</button>
        <div id="results" style="margin-top:16px"></div>
      </div>

      <p class="ph-note">새 테이블을 추가할 때마다 이 목록(TABLES)에 한 줄 추가하고 다시 점검하세요.</p>

      <a href="./index.html" class="mju-btn mju-btn--secondary mju-btn--full" style="text-decoration:none;text-align:center;margin-top:auto">홈으로</a>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module">
    import { supabase, configReady } from './app.js';
    if (window.lucide) window.lucide.createIcons();
    const results = document.getElementById('results');

    // 익명이 절대 읽으면 안 되는 테이블들 (개인정보 포함)
    const MUST_BE_BLOCKED = ['students', 'registrations', 'push_logs', 'push_tokens', 'consultations', 'consultation_messages', 'survey_responses', 'deletion_log', 'sync_log', 'notice_recipients', 'company_contacts', 'survey_answers', 'poll_votes', 'company_info', 'admin_users'];
    // 익명이 "공개분만" 읽어야 하는 테이블 (의도된 공개 — 읽히는 게 정상)
    const PUBLIC_OK = ['notices', 'library', 'calendar_events', 'jobs', 'companies', 'surveys', 'polls', 'centers'];

    document.getElementById('run').addEventListener('click', async () => {
      if (!configReady()) { results.innerHTML = '<div class="mju-alert mju-alert--warning"><span class="mju-alert__icon"><i data-lucide="alert-triangle"></i></span><div class="mju-alert__body"><div class="mju-alert__text">config.js 의 Supabase 값을 먼저 채워주세요.</div></div></div>'; window.lucide?.createIcons(); return; }
      results.innerHTML = '<p class="ph-note">검사 중...</p>';
      let html = '';

      for (const t of MUST_BE_BLOCKED) {
        const { data, error } = await supabase.from(t).select('*').limit(5);
        const leaked = !error && Array.isArray(data) && data.length > 0;
        html += `<div class="sec-check-row"><i data-lucide="${leaked ? 'unlock' : 'lock'}"></i><span class="tn">${t}</span><span style="margin-left:auto">` +
          (leaked
            ? `<span class="mju-badge mju-badge--coral">읽힘 FAIL · ${data.length}줄 노출</span>`
            : `<span class="mju-badge mju-badge--success">차단됨 PASS</span>`) + `</span></div>`;
      }
      for (const t of PUBLIC_OK) {
        const { error } = await supabase.from(t).select('*').limit(1);
        html += `<div class="sec-check-row"><i data-lucide="${error ? 'alert-triangle' : 'check'}"></i><span class="tn">${t}</span><span style="margin-left:auto">` +
          (error ? `<span class="mju-badge mju-badge--coral">읽기 오류</span>`
                 : `<span class="mju-badge mju-badge--neutral">공개 정상</span>`) +
          `</span></div>` +
          (error ? `<p class="ph-note" style="margin:2px 0 6px">정책/컬럼 확인: ${error.message}</p>`
                 : `<p class="ph-note" style="margin:2px 0 6px">발행/active/숨김 게이트는 SQL에서 확인</p>`);
      }
      // 가입 INSERT 는 되어야 정상 (쓰기 테스트는 더미가 쌓이므로 생략, 가입 페이지에서 확인)
      results.innerHTML = html + '<p class="ph-note" style="margin-top:10px"><b>MUST_BE_BLOCKED</b> 가 모두 <b>차단됨 PASS</b> 여야 운영 가능합니다.</p>';
      window.lucide?.createIcons();
    });
  </script>
</body>
</html>
