<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>자주 묻는 질문 · 일학습병행 앱</title>
  <meta name="description" content="명지대 일학습병행 — 자주 묻는 질문과 실제 들어온 질문·답변 모음" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#002968" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
</head>
<body>
  <div class="app">
    <header class="ph-header">
      <img class="wm" src="./assets/logo-mono-white.png" alt="" />
      <div class="ph-lockup"><img src="./assets/logo-mono-white.png" alt="" /><span>일학습병행 공동훈련센터</span></div>
      <div class="ph-title-row"><a class="ph-back" href="./index.html" aria-label="뒤로"><i data-lucide="chevron-left"></i></a><h1 class="ph-title">자주 묻는 질문</h1></div>
      <p class="ph-sub">막히는 부분이 있으면 먼저 여기를 확인해보세요 — 실제 들어온 질문과 답변도 모았어요</p>
    </header>

    <main class="ph-body">
      <div class="searchbar" id="sb" style="display:none">
        <i data-lucide="search"></i>
        <input type="search" id="q" placeholder="질문 검색" aria-label="질문 검색" autocomplete="off" />
        <button type="button" class="sb-clear" id="qClear" aria-label="검색어 지우기" style="display:none">✕</button>
      </div>
      <div class="filter-chips" id="chips" style="display:none" role="group" aria-label="카테고리 필터"></div>
      <div id="list"></div>
      <div class="empty-state" id="empty" style="display:none">
        <span class="ei"><i data-lucide="circle-help"></i></span>
        <div class="et">조건에 맞는 질문이 없어요</div>
        <p class="es">검색어나 카테고리를 바꿔보세요.</p>
      </div>

      <div class="card accent" style="margin-top:6px">
        <p class="ph-card-title"><i data-lucide="message-circle"></i> 해결이 안 되나요?</p>
        <p class="ph-note" style="margin-bottom:12px">담당자와 1:1 상담으로 직접 문의할 수 있어요.</p>
        <a href="./consult.html" class="mju-btn mju-btn--full" style="text-decoration:none">1:1 상담하기</a>
      </div>

      <a href="./index.html" class="mju-btn mju-btn--secondary mju-btn--full" style="margin-top:auto;text-decoration:none">홈으로</a>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module">
    import { supabase, configReady, esc, getProfile, skeletonList, clearSkeleton } from './app.js';
    if (window.lucide) window.lucide.createIcons();

    const $ = id => document.getElementById(id);
    const listEl = $('list'), emptyEl = $('empty'), chipsEl = $('chips');
    const qEl = $('q'), qClear = $('qClear');
    const profile = getProfile();
    const myRole = profile.target_type || 'applicant';

    const contact = (window.APP_CONFIG && window.APP_CONFIG.PRIVACY_OFFICER_CONTACT) || '';
    const officer = (window.APP_CONFIG && window.APP_CONFIG.PRIVACY_OFFICER) || '';
    const contactLine = contact ? `${officer ? esc(officer) + ' · ' : ''}${esc(contact)}` : '연락처는 개인정보 처리방침에서 확인해주세요.';

    // 앱 사용법 — 정적 항목 (aud: all/student/company — 내 대상에 맞는 것만 표시)
    const STATIC_FAQ = [
      { aud: 'student', icon: 'user-x', q: '가입할 때 "명단에서 확인되지 않습니다"라고 나와요',
        a: '가입은 센터가 보유한 <b>학습근로자 명단(이름+휴대폰)</b>과 자동 대조해 진행돼요. 확인이 안 되는 흔한 이유는<br/>① 명단에 <b>다른 휴대폰 번호</b>가 등록돼 있거나(번호 변경 등) ② 이름 표기가 다르거나(띄어쓰기·한자) ③ 아직 명단이 준비 중인 경우예요.<br/>이름·번호를 다시 확인한 뒤에도 안 되면 가입 화면의 <b>"가입 도움 요청 보내기"</b>를 눌러주세요. 담당자가 확인 후 연락드립니다.' },
      { aud: 'all', icon: 'bell-off', q: '아이폰인데 알림(푸시)이 안 와요',
        a: '아이폰은 애플 정책상 <b>홈 화면에 추가한 앱 아이콘으로 연 상태</b>에서만 웹 알림을 켤 수 있어요(iOS 16.4 이상).<br/>① Safari로 이 사이트를 열고 → ② 공유 버튼(□↑) → <b>"홈 화면에 추가"</b> → ③ 홈 화면의 앱 아이콘으로 열기 → ④ <a href="./install.html">알림 설정</a>에서 <b>"알림 켜기"</b>.<br/>그래도 안 오면 아이폰 설정 → 알림 → 일학습앱에서 알림 허용을 확인해주세요.' },
      { aud: 'all', icon: 'bell-off', q: '안드로이드인데 알림이 안 와요',
        a: '① 크롬(Chrome)으로 사이트를 열고 <a href="./install.html">알림 설정</a>에서 <b>"알림 켜기"</b>를 눌렀는지 확인해주세요.<br/>② 휴대폰 설정 → 앱 → Chrome(또는 설치한 일학습앱) → 알림이 허용돼 있는지 확인해주세요.<br/>③ 절전 모드·데이터 절약 모드에서는 알림이 늦게 올 수 있어요.' },
      { aud: 'all', icon: 'message-square-warning', q: '카카오톡으로 열었더니 설치·알림이 안 돼요',
        a: '카카오톡·인스타그램 등 <b>앱 안의 브라우저</b>에서는 홈 화면 추가와 알림이 막혀 있어요.<br/>화면 오른쪽 위 <b>⋮ (또는 공유) 메뉴 → "다른 브라우저로 열기"</b>를 눌러 <b>아이폰=Safari, 안드로이드=크롬</b>으로 다시 열어주세요.' },
      { aud: 'all', icon: 'smartphone', q: '휴대폰을 바꿨어요 / 정보가 사라졌어요',
        a: '다시 가입할 필요 없어요. 새 기기(또는 새로 연 앱)에서 첫 화면의 <b>"내 정보 불러오기"</b>에 이름·휴대폰(또는 초대코드)만 입력하면 기존 정보가 그대로 복원됩니다.<br/>복원 후에는 <a href="./install.html">알림 설정</a>에서 알림을 한 번 더 켜주세요(기기가 바뀌면 알림 수신 등록도 새로 필요해요).' },
      { aud: 'all', icon: 'filter', q: '맞춤 공지·자료가 안 보여요',
        a: '공지·자료·일정은 <b>내 직무·소속 기업·대상</b>에 맞춰 골라서 보여드려요. 이 기기에 내 정보가 없으면 전체 공개 글만 보입니다.<br/><a href="./index.html">홈</a>에서 내 정보를 불러온 뒤 다시 확인해주세요.' },
      { aud: 'student', icon: 'shield', q: '익명 건의함은 정말 익명인가요?',
        a: '네. 건의함 글은 <b>작성자 정보 없이 내용만</b> 저장되며, 담당자(관리자)만 열람합니다.<br/>단, 답변을 받아야 하는 문의라면 작성자를 알 수 있는 <a href="./consult.html">1:1 상담</a>을 이용해주세요.' },
      { aud: 'company', icon: 'route', q: '우리 회사 진행 현황은 어디서 보나요?',
        a: '기업담당자로 가입하면 홈 화면에 <b>우리 회사 진행 현황</b> 카드가 표시돼요(참여신청 → 공단 현장실사 → 지정완료 → … → 훈련 운영 중).<br/>카드가 안 보이면 홈에서 소속 기업으로 <b>내 정보 불러오기</b>를 해주세요.' },
      { aud: 'company', icon: 'key-round', q: '기업 초대코드는 어디서 받나요?',
        a: '학습기업 <b>지정완료 안내 메일</b>에 동봉돼요. 가입할 때 코드만 입력하면 소속 기업이 자동으로 선택됩니다.<br/>코드가 없어도 기업명을 직접 선택해 가입할 수 있어요. 코드를 못 받았다면 센터로 문의해주세요.' },
      { aud: 'company', icon: 'clipboard-list', q: '기업 만족도 설문은 어디서 하나요?',
        a: '홈 → <b>만족도 조사</b>에서 기업현장교사/HRD담당자 중 본인 역할을 선택해 참여해요.<br/>응답은 기업명과 함께 운영팀에 전달됩니다(이름·연락처는 저장하지 않아요).' },
      { aud: 'all', icon: 'trash-2', q: '내 개인정보를 삭제(탈퇴)하고 싶어요',
        a: `개인정보 열람·정정·삭제·동의 철회는 개인정보 보호책임자에게 요청할 수 있어요.<br/><b>${contactLine}</b><br/>자세한 내용은 <a href="./privacy.html">개인정보 처리방침</a>을 확인해주세요.` },
    ];
    const audOk = a => a === 'all' || (myRole === 'student' && a === 'student') || (myRole === 'company' && a === 'company');

    let all = [], catSel = '';

    function render() {
      const q = (qEl.value || '').trim().toLowerCase();
      qClear.style.display = q ? 'block' : 'none';
      const shown = all.filter(p =>
        (!catSel || p.category === catSel) &&
        (!q || [p.question, p.plain, p.category].some(x => (x || '').toLowerCase().includes(q))));
      listEl.innerHTML = '';
      if (!shown.length) { emptyEl.style.display = 'block'; window.lucide?.createIcons(); return; }
      emptyEl.style.display = 'none';
      shown.forEach(p => {
        const d = document.createElement('details');
        d.className = 'faq-item';
        d.innerHTML =
          `<summary><i aria-hidden="true" data-lucide="${p.icon || 'message-circle-question'}"></i><span style="flex:1;min-width:0">${esc(p.question)}</span>` +
          `<i aria-hidden="true" data-lucide="chevron-down" class="fq-arrow"></i></summary>` +
          `<div class="fq-a">${p.answerHtml}` +
          (p.category && p.category !== '앱 사용법' ? `<div style="margin-top:8px"><span class="mju-badge mju-badge--neutral">${esc(p.category)}</span></div>` : '') + `</div>`;
        listEl.appendChild(d);
      });
      window.lucide?.createIcons();
    }
    function syncChips() {
      [...chipsEl.children].forEach(b => {
        const on = b.dataset.val === catSel;
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }
    function buildChips() {
      const cats = [...new Set(all.map(p => p.category).filter(Boolean))];
      if (cats.length < 2) return;
      chipsEl.innerHTML = '';
      const mk = (label, val) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chip'; b.textContent = label; b.dataset.val = val;
        b.addEventListener('click', () => { catSel = val; syncChips(); render(); });
        chipsEl.appendChild(b);
      };
      mk('전체', '');
      cats.forEach(c => mk(c, c));
      syncChips();
      chipsEl.style.display = 'flex';
    }
    qEl.addEventListener('input', render);
    qClear.addEventListener('click', () => { qEl.value = ''; render(); qEl.focus(); });

    (async () => {
      // 1) 제도·운영 Q&A (DB, 내 대상 + 전체 글만)
      let dbItems = [];
      if (configReady()) {
        skeletonList(listEl, 3);
        try {
          const res = await supabase.from('qna_posts')
            .select('audience,category,question,answer,created_at')
            .eq('published', true).order('created_at', { ascending: false }).limit(200);
          if (!res.error) {
            dbItems = (res.data || [])
              .filter(p => p.audience === 'all' || p.audience === myRole)
              .map(p => ({ category: p.category || '기타', question: p.question, plain: p.answer, answerHtml: esc(p.answer).replace(/\n/g, '<br/>') }));
          }
        } catch (_) {}
        clearSkeleton(listEl);
      }
      // 2) 앱 사용법 (정적, 내 대상에 맞는 것만)
      const staticItems = STATIC_FAQ.filter(s => audOk(s.aud))
        .map(s => ({ category: '앱 사용법', icon: s.icon, question: s.q, plain: s.a.replace(/<[^>]+>/g, ' '), answerHtml: s.a }));
      all = [...dbItems, ...staticItems];
      if (all.length > 5) $('sb').style.display = 'block';
      buildChips();
      render();
    })();
  </script>
</body>
</html>
