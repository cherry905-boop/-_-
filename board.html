<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>익명 건의함 · 일학습병행 앱</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1f4e8c" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
</head>
<body>
  <div class="topbar"><h1>🙈 익명 건의함</h1><p>남긴 글은 담당자만 봅니다 (다른 분께는 안 보여요)</p></div>
  <div class="wrap">
    <div class="card">
      <textarea id="body" rows="4" style="width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px" placeholder="건의·고민·불편한 점을 익명으로 남겨주세요"></textarea>
      <button class="btn" id="post">익명으로 보내기</button>
      <div class="status" id="status"></div>
      <p class="note">작성자 정보는 저장하지 않습니다. <b>담당자(관리자)만</b> 확인하며, 다른 학생에게는 보이지 않습니다.</p>
    </div>
    <div class="card" id="done" style="display:none;text-align:center">
      <h2>✅ 전달됐어요</h2>
      <p class="note">소중한 의견 감사합니다. 담당자가 확인합니다.</p>
      <button class="btn ghost" id="again">하나 더 남기기</button>
    </div>
    <a href="./index.html" class="btn ghost" id="homeBtn" style="text-decoration:none;text-align:center;margin-top:20px">홈으로</a>
  </div>

  <script type="module">
    import { supabase, configReady, setStatus } from './app.js';
    const $ = id => document.getElementById(id);

    $('post').addEventListener('click', async () => {
      const body = $('body').value.trim();
      if (!body) { setStatus($('status'), '내용을 입력해주세요.', 'error'); return; }
      if (!configReady()) { setStatus($('status'), 'Supabase 연결이 필요합니다.', 'error'); return; }
      $('post').disabled = true; setStatus($('status'), '보내는 중...', 'info');
      const { error } = await supabase.from('board_posts').insert({ body });
      $('post').disabled = false;
      if (error) { setStatus($('status'), '오류: ' + error.message, 'error'); return; }
      $('body').value = '';
      document.querySelector('.card').style.display = 'none';
      $('done').style.display = 'block';
    });

    $('again').addEventListener('click', () => {
      $('done').style.display = 'none';
      document.querySelector('.card').style.display = 'block';
      setStatus($('status'), '', '');
    });
  </script>
</body>
</html>
